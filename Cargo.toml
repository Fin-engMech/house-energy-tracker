[package]
name = "energy-tracker"
version = "1.0.0"
edition = "2021"
description = "House Energy Tracker: local desktop app for tracking gas and electricity against a capped bill"
license = "MIT"
repository = "https://github.com/Fin-engMech/house-energy-tracker"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
form_urlencoded = "1"
sha1_smol = "1"
wry = "0.57.2"
tao = "0.37.2"
png = "0.18.1"
socket2 = "0.6.5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
